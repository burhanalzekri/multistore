<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="msGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="50%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
    <linearGradient id="msShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,.4)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="msShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Shadow -->
  <circle cx="60" cy="60" r="52" fill="rgba(0,0,0,.08)"/>

  <!-- Main Circle -->
  <circle cx="60" cy="56" r="52" fill="url(#msGrad)" filter="url(#msShadow)"/>

  <!-- Highlight -->
  <path d="M 60 8 A 52 52 0 0 1 110 40 A 52 52 0 0 0 60 12 Z" fill="url(#msShine)"/>

  <!-- M Letter -->
  <text x="60" y="78" text-anchor="middle" font-family="Cairo, Arial Black, sans-serif" font-size="60" font-weight="900" fill="#ffffff" letter-spacing="-3">M</text>

  <!-- Subtle highlight dot -->
  <circle cx="38" cy="32" r="6" fill="rgba(255,255,255,.4)" opacity="0.7"/>
</svg>
