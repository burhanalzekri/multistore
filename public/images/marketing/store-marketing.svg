<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faf9"/>
      <stop offset="1" stop-color="#dff5ec"/>
    </linearGradient>
    <linearGradient id="barTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9f5c4"/>
      <stop offset="1" stop-color="#b7e84a"/>
    </linearGradient>
    <linearGradient id="barFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#15966d"/>
    </linearGradient>
    <linearGradient id="barRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15966d"/>
      <stop offset="1" stop-color="#0c7253"/>
    </linearGradient>
    <filter id="shadow3">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="15"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <rect width="1200" height="900" fill="url(#bg3)"/>
  
  <!-- Title area -->
  <text x="600" y="110" text-anchor="middle" font-family="Arial" font-size="44" font-weight="900" fill="#071a16">التسويق والنمو</text>
  <text x="600" y="155" text-anchor="middle" font-family="Arial" font-size="18" fill="#61716c">قِس أداء متجرك وطوّره مع الوقت</text>
  
  <!-- 3D Chart Panel -->
  <g transform="translate(600 550)">
    
    <!-- Shadow under chart -->
    <ellipse cx="0" cy="200" rx="420" ry="40" fill="#000" opacity="0.15"/>
    
    <!-- 3D Bar chart -->
    <g transform="translate(-300 0)">
      
      <!-- Bar 1 -->
      <g transform="translate(0 -60)">
        <path d="M -45 60 L 45 60 L 45 -100 L -45 -100 Z" fill="url(#barFront)"/>
        <path d="M 45 60 L 75 40 L 75 -120 L 45 -100 Z" fill="url(#barRight)"/>
        <path d="M -45 -100 L 45 -100 L 75 -120 L -15 -120 Z" fill="url(#barTop)"/>
      </g>
      
      <!-- Bar 2 -->
      <g transform="translate(130 -110)">
        <path d="M -45 60 L 45 60 L 45 -110 L -45 -110 Z" fill="url(#barFront)"/>
        <path d="M 45 60 L 75 40 L 75 -130 L 45 -110 Z" fill="url(#barRight)"/>
        <path d="M -45 -110 L 45 -110 L 75 -130 L -15 -130 Z" fill="url(#barTop)"/>
      </g>
      
      <!-- Bar 3 (highlight) -->
      <g transform="translate(260 -180)">
        <path d="M -45 60 L 45 60 L 45 -140 L -45 -140 Z" fill="url(#barFront)"/>
        <path d="M 45 60 L 75 40 L 75 -160 L 45 -140 Z" fill="url(#barRight)"/>
        <path d="M -45 -140 L 45 -140 L 75 -160 L -15 -160 Z" fill="url(#barTop)"/>
        <!-- Star on top -->
        <g transform="translate(15 -180)">
          <circle r="22" fill="#f3c969" opacity="0.3"/>
          <circle r="14" fill="#f3c969"/>
          <text y="6" text-anchor="middle" font-family="Arial" font-size="18" font-weight="900" fill="#071a16">★</text>
        </g>
      </g>
      
      <!-- Bar 4 -->
      <g transform="translate(390 -230)">
        <path d="M -45 60 L 45 60 L 45 -160 L -45 -160 Z" fill="url(#barFront)"/>
        <path d="M 45 60 L 75 40 L 75 -180 L 45 -160 Z" fill="url(#barRight)"/>
        <path d="M -45 -160 L 45 -160 L 75 -180 L -15 -180 Z" fill="url(#barTop)"/>
      </g>
      
      <!-- Bar 5 (tallest) -->
      <g transform="translate(520 -290)">
        <path d="M -45 60 L 45 60 L 45 -190 L -45 -190 Z" fill="url(#barFront)"/>
        <path d="M 45 60 L 75 40 L 75 -210 L 45 -190 Z" fill="url(#barRight)"/>
        <path d="M -45 -190 L 45 -190 L 75 -210 L -15 -210 Z" fill="url(#barTop)"/>
        <!-- Trophy -->
        <g transform="translate(15 -240)">
          <circle r="26" fill="#b7e84a" opacity="0.3"/>
          <circle r="16" fill="#b7e84a"/>
          <text y="7" text-anchor="middle" font-family="Arial" font-size="18" font-weight="900" fill="#071a16">↑</text>
        </g>
      </g>
      
      <!-- Base ground -->
      <path d="M -100 60 L 660 60 L 690 40 L -70 40 Z" fill="#8fada3"/>
      
      <!-- Labels -->
      <text x="0" y="95" text-anchor="middle" font-family="Arial" font-size="13" fill="#61716c">الأسبوع 1</text>
      <text x="130" y="95" text-anchor="middle" font-family="Arial" font-size="13" fill="#61716c">الأسبوع 2</text>
      <text x="260" y="95" text-anchor="middle" font-family="Arial" font-size="13" fill="#61716c">الأسبوع 3</text>
      <text x="390" y="95" text-anchor="middle" font-family="Arial" font-size="13" fill="#61716c">الأسبوع 4</text>
      <text x="520" y="95" text-anchor="middle" font-family="Arial" font-size="13" fill="#61716c">الأسبوع 5</text>
    </g>
  </g>
</svg>
